<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YuzuPlay Apps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- APK Manifest & Icon Parser -->
  <script src="https://unpkg.com/app-info-parser/dist/app-info-parser.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen font-sans transition-colors duration-150">

  <!-- React Native Style Flat AppBar -->
  <header class="sticky top-0 z-10 bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 px-4 py-3">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
          Y
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight tracking-tight">YuzuPlay Apps</h1>
          <p class="text-[11px] text-zinc-500 dark:text-zinc-400">Tap any app to download directly</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- Theme Toggle Button -->
        <button onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Theme"
          class="p-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-700 active:opacity-70 transition">
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="sunIcon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="moonIcon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>

        <!-- Admin Upload Trigger -->
        <button onclick="toggleModal()"
          class="bg-blue-600 active:opacity-75 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
          + Upload
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container (React Native FlatList Style) -->
  <main class="max-w-xl mx-auto p-3.5">
    <!-- Search Bar -->
    <div class="relative mb-3">
      <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps, version, or uploader..."
        class="w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition-colors" />
    </div>

    <!-- RecyclerView / FlatList Container -->
    <div id="recyclerList" class="space-y-2">
      <div class="text-center text-zinc-500 py-12 text-xs">Loading apps...</div>
    </div>
  </main>

  <!-- Admin Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl max-w-md w-full p-4 space-y-3.5">
      <div class="flex justify-between items-center border-b border-zinc-100 dark:border-zinc-800 pb-2.5">
        <h2 class="text-sm font-bold">Upload APK</h2>
        <button onclick="toggleModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 text-sm px-1">✕</button>
      </div>

      <form id="uploadForm" class="space-y-3" onsubmit="handleUpload(event)">
        <div>
          <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">APK File</label>
          <input type="file" id="apkFile" accept=".apk" required onchange="parseApkFile(this)"
            class="w-full text-xs text-zinc-600 dark:text-zinc-300 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-zinc-100 dark:file:bg-zinc-800 file:text-blue-600 dark:file:text-blue-400 file:font-medium cursor-pointer" />
        </div>

        <!-- Auto Preview of Extracted Icon & Info -->
        <div id="apkPreview" class="hidden items-center space-x-3 bg-zinc-50 dark:bg-zinc-950 p-2.5 rounded-lg border border-zinc-200 dark:border-zinc-800">
          <img id="previewIcon" src="" class="w-10 h-10 rounded-lg object-cover border border-zinc-200 dark:border-zinc-800" />
          <div class="text-xs min-w-0">
            <div class="font-semibold text-blue-600 dark:text-blue-400">APK Ready</div>
            <div id="previewPkg" class="text-zinc-500 truncate"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">App Name</label>
            <input type="text" id="appName" placeholder="Auto-filled" required
              class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">Version</label>
            <input type="text" id="appVersion" placeholder="Auto-filled" required
              class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
          </div>
        </div>

        <div>
          <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">Uploader Name</label>
          <input type="text" id="uploaderName" placeholder="e.g. Ayan" required
            class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        </div>

        <!-- One-Time Admin Key Section -->
        <div id="tokenInputWrapper">
          <label class="text-xs font-medium text-zinc-500 dark:text-zinc-400 block mb-1">Admin Access Key (One-time setup)</label>
          <input type="password" id="ghToken" placeholder="Enter access token..."
            class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        </div>

        <div id="savedTokenBadge" class="hidden items-center justify-between bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2">
          <span class="text-xs text-zinc-600 dark:text-zinc-400">✓ Admin Key Saved</span>
          <button type="button" onclick="resetSavedToken()" class="text-xs text-blue-600 dark:text-blue-400 font-medium hover:underline">
            Change Key
          </button>
        </div>

        <!-- Upload Progress Bar with Percentage -->
        <div id="progressContainer" class="hidden space-y-1.5 pt-1">
          <div class="flex justify-between items-center text-xs">
            <span id="statusText" class="text-zinc-600 dark:text-zinc-400 font-medium">Uploading...</span>
            <span id="progressPercent" class="font-mono font-semibold text-blue-600 dark:text-blue-400">0%</span>
          </div>
          <div class="w-full bg-zinc-200 dark:bg-zinc-800 h-2 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-150"></div>
          </div>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-blue-600 active:opacity-80 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Publish App
        </button>
      </form>
    </div>
  </div>

  <script>
    // === REPO CONFIG ===
    const OWNER  = "mrcutex";
    const REPO   = "yuzuplayapp";
    const BRANCH = "main";

    const TOKEN_STORAGE_KEY    = "yuzuplay_admin_token";
    const UPLOADER_STORAGE_KEY = "yuzuplay_uploader_name";
    const THEME_STORAGE_KEY    = "yuzuplay_theme";

    let allApps = [];
    let extractedIconBase64 = "";

    // === 0. Theme & Saved Credentials Initialization ===
    function initApp() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "dark";
      document.documentElement.classList.toggle("dark", savedTheme === "dark");

      const savedUploader = localStorage.getItem(UPLOADER_STORAGE_KEY);
      if (savedUploader) {
        document.getElementById("uploaderName").value = savedUploader;
      }

      syncTokenUI();
      loadApps();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle("dark");
      localStorage.setItem(THEME_STORAGE_KEY, isDark ? "dark" : "light");
    }

    function syncTokenUI() {
      const savedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
      const inputWrapper = document.getElementById("tokenInputWrapper");
      const savedBadge = document.getElementById("savedTokenBadge");
      const tokenInput = document.getElementById("ghToken");

      if (savedToken) {
        inputWrapper.classList.add("hidden");
        savedBadge.classList.remove("hidden");
        savedBadge.classList.add("flex");
        tokenInput.required = false;
      } else {
        inputWrapper.classList.remove("hidden");
        savedBadge.classList.add("hidden");
        savedBadge.classList.remove("flex");
        tokenInput.required = true;
      }
    }

    function resetSavedToken() {
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      document.getElementById("ghToken").value = "";
      syncTokenUI();
    }

    // === 1. Auto-extract Original Name, Version & App Icon from .apk ===
    async function parseApkFile(input) {
      const file = input.files[0];
      if (!file) return;

      const progressBox = document.getElementById("progressContainer");
      const status = document.getElementById("statusText");
      const percent = document.getElementById("progressPercent");
      const bar = document.getElementById("progressBar");

      progressBox.classList.remove("hidden");
      status.innerText = "Reading APK manifest...";
      percent.innerText = "";
      bar.style.width = "0%";

      try {
        const parser = new AppInfoParser(file);
        const result = await parser.parse();

        const label = Array.isArray(result.application.label)
          ? result.application.label[0]
          : result.application.label;

        document.getElementById("appName").value = label || file.name.replace(/\.apk$/i, "");
        document.getElementById("appVersion").value = result.versionName || "1.0";

        if (result.icon) {
          extractedIconBase64 = result.icon;
          document.getElementById("previewIcon").src = result.icon;
          document.getElementById("previewPkg").innerText = result.package || "";
          document.getElementById("apkPreview").classList.remove("hidden");
          document.getElementById("apkPreview").classList.add("flex");
        }
        progressBox.classList.add("hidden");
      } catch (err) {
        document.getElementById("appName").value = file.name.replace(/\.apk$/i, "");
        status.innerText = "Please verify app name and version.";
      }
    }

    // === 2. Load App List ===
    async function loadApps() {
      const container = document.getElementById("recyclerList");
      try {
        const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/apps.json?t=${Date.now()}`;
        const res = await fetch(rawUrl);

        if (res.status === 404) {
          allApps = [];
          renderRecyclerView([]);
          return;
        }
        allApps = await res.json();
        renderRecyclerView(allApps);
      } catch (err) {
        container.innerHTML = `<div class="text-center text-zinc-500 py-12 text-xs">No apps available yet.</div>`;
      }
    }

    // === 3. Render React Native Style Flat Cards ===
    function renderRecyclerView(apps) {
      const container = document.getElementById("recyclerList");
      if (!apps || apps.length === 0) {
        container.innerHTML = `<div class="text-center text-zinc-500 py-12 text-xs">No apps found.</div>`;
        return;
      }

      container.innerHTML = apps.map(app => {
        const dateStr = new Date(app.uploadedAt).toLocaleDateString("en-IN", {
          day: "2-digit", month: "short", year: "numeric"
        });

        const iconHtml = app.icon
          ? `<img src="${app.icon}" class="w-11 h-11 rounded-lg object-cover shrink-0 border border-zinc-200 dark:border-zinc-800" />`
          : `<div class="w-11 h-11 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-600 dark:text-blue-400 font-bold text-xs shrink-0">APK</div>`;

        return `
          <a href="${app.downloadUrl}" download
             class="flex items-center justify-between bg-white dark:bg-zinc-900 active:opacity-70 border border-zinc-200 dark:border-zinc-800 rounded-lg p-3 transition-opacity cursor-pointer">
            <div class="flex items-center space-x-3 min-w-0">
              ${iconHtml}
              <div class="min-w-0">
                <div class="flex items-center space-x-1.5">
                  <h3 class="font-semibold text-sm truncate">${escapeHtml(app.name)}</h3>
                  <span class="text-[11px] bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 px-1.5 py-0.5 rounded font-mono shrink-0">
                    v${escapeHtml(app.version)}
                  </span>
                </div>
                <div class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5 flex flex-wrap items-center gap-x-1.5">
                  <span>${escapeHtml(app.uploader)}</span>
                  <span>•</span>
                  <span>${dateStr}</span>
                  <span>•</span>
                  <span>${escapeHtml(app.size)}</span>
                </div>
              </div>
            </div>

            <div class="shrink-0 ml-3 bg-zinc-100 dark:bg-zinc-800 text-blue-600 dark:text-blue-400 px-3 py-1.5 rounded-lg text-xs font-semibold">
              Get
            </div>
          </a>
        `;
      }).join("");
    }

    // Helper: Convert File to Base64 with Progress
    function fileToBase64(file, onProgress) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onprogress = (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(Math.round((e.loaded / e.total) * 15)); // 0% to 15% for reading file
          }
        };
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Helper: PUT request with real XMLHttpRequest upload progress
    function putWithProgress(url, token, payloadObj, onUploadProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", url, true);
        xhr.setRequestHeader("Authorization", `Bearer ${token}`);
        xhr.setRequestHeader("Accept", "application/vnd.github+json");
        xhr.setRequestHeader("Content-Type", "application/json");

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onUploadProgress) {
            const ratio = e.loaded / e.total;
            onUploadProgress(ratio);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(JSON.parse(xhr.responseText));
          } else {
            try {
              const err = JSON.parse(xhr.responseText);
              reject(new Error(err.message || `Upload failed (${xhr.status})`));
            } catch {
              reject(new Error(`Upload failed (${xhr.status})`));
            }
          }
        };

        xhr.onerror = () => reject(new Error("Network error during upload"));
        xhr.send(JSON.stringify(payloadObj));
      });
    }

    function setProgress(pct, text) {
      document.getElementById("progressContainer").classList.remove("hidden");
      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("progressPercent").innerText = `${pct}%`;
      if (text) document.getElementById("statusText").innerText = text;
    }

    // === 4. Upload APK & Update List with Live Progress ===
    async function handleUpload(e) {
      e.preventDefault();
      const file = document.getElementById("apkFile").files[0];
      const name = document.getElementById("appName").value.trim();
      const version = document.getElementById("appVersion").value.trim();
      const uploader = document.getElementById("uploaderName").value.trim();
      const inputToken = document.getElementById("ghToken").value.trim();
      const token = localStorage.getItem(TOKEN_STORAGE_KEY) || inputToken;

      if (!token) {
        alert("Please enter your Admin Access Key.");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.classList.add("opacity-60");
      btn.innerText = "Uploading...";

      try {
        setProgress(2, "Preparing APK...");
        const base64Apk = await fileToBase64(file, (p) => setProgress(p, "Encoding APK..."));

        const safeFileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
        const apkPath = `apks/${safeFileName}`;

        // Step A: Upload APK binary (15% -> 90% progress)
        setProgress(15, "Uploading APK...");
        await putWithProgress(
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/${apkPath}`,
          token,
          {
            message: `Add ${name} v${version}`,
            content: base64Apk,
            branch: BRANCH
          },
          (ratio) => {
            const pct = 15 + Math.round(ratio * 75);
            setProgress(pct, "Uploading APK...");
          }
        );

        // Save Token & Uploader in localStorage once verified
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
        localStorage.setItem(UPLOADER_STORAGE_KEY, uploader);
        syncTokenUI();

        const downloadUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${apkPath}`;
        const fileSizeMB = (file.size / (1024 * 1024)).toFixed(1) + " MB";

        // Step B: Update apps.json (90% -> 100%)
        setProgress(92, "Updating catalog...");
        let currentApps = [];
        let fileSha = null;

        const metaRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/apps.json?ref=${BRANCH}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (metaRes.ok) {
          const metaJson = await metaRes.json();
          fileSha = metaJson.sha;
          const decoded = decodeURIComponent(escape(atob(metaJson.content.replace(/\n/g, ""))));
          currentApps = JSON.parse(decoded);
        }

        const newAppEntry = {
          id: Date.now().toString(),
          name,
          version,
          uploader,
          size: fileSizeMB,
          uploadedAt: new Date().toISOString(),
          downloadUrl,
          icon: extractedIconBase64 || ""
        };
        currentApps.unshift(newAppEntry);

        const updatedJsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentApps, null, 2))));

        await putWithProgress(
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/apps.json`,
          token,
          {
            message: `Update catalog for ${name}`,
            content: updatedJsonBase64,
            ...(fileSha ? { sha: fileSha } : {}),
            branch: BRANCH
          },
          (ratio) => {
            setProgress(92 + Math.round(ratio * 8), "Finalizing...");
          }
        );

        setProgress(100, "Done!");

        allApps = currentApps;
        renderRecyclerView(allApps);

        // Reset form except saved uploader
        document.getElementById("apkFile").value = "";
        document.getElementById("appName").value = "";
        document.getElementById("appVersion").value = "";
        document.getElementById("apkPreview").classList.add("hidden");
        document.getElementById("progressContainer").classList.add("hidden");
        extractedIconBase64 = "";
        toggleModal();
      } catch (err) {
        if (err.message.toLowerCase().includes("bad credentials") || err.message.includes("401")) {
          resetSavedToken();
        }
        alert("Upload Error: " + err.message);
        document.getElementById("statusText").innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-60");
        btn.innerText = "Publish App";
      }
    }

    function filterApps() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      renderRecyclerView(allApps.filter(a =>
        a.name.toLowerCase().includes(q) ||
        a.uploader.toLowerCase().includes(q) ||
        a.version.toLowerCase().includes(q)
      ));
    }

    function toggleModal() {
      const modal = document.getElementById("uploadModal");
      modal.classList.toggle("hidden");
      modal.classList.toggle("flex");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[m]));
    }

    initApp();
  </script>
</body>
</html>
